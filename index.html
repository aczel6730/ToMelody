<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03040c">
<title>手可摘星辰</title>
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html, body{ height:100%; overflow:hidden; background:#03040c; }
  body{
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none;
    touch-action: none;
    color:#dfe8ff;
  }
  #sky{ display:block; width:100%; height:100%; }

  .title{
    position:fixed; left:0; right:0; top:36%;
    text-align:center; pointer-events:none; z-index:5;
    opacity:0; transform:translateY(10px);
    transition:opacity 2.4s ease, transform 2.8s cubic-bezier(.2,.7,.3,1);
  }
  .title.on{ opacity:1; transform:translateY(0); }
  .title h1{
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    font-weight:400;
    font-size: clamp(26px, 7vw, 42px);
    letter-spacing:.34em; text-indent:.34em;
    color:#f4f8ff;
    text-shadow: 0 0 22px rgba(160,195,255,.55), 0 0 60px rgba(90,140,255,.32);
  }
  .title p{
    margin-top:26px;
    font-size: clamp(10px, 2.9vw, 13px);
    letter-spacing:.5em; text-indent:.5em;
    color: rgba(205,222,255,.42);
  }

  .stagetip{
    position:fixed; left:0; right:0;
    top: 40%;
    padding: 0 11%;
    text-align:center;
    white-space: pre-line;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    font-size: clamp(18px, 5vw, 26px);
    line-height: 2;
    letter-spacing:.16em;
    color:#fff6e8;
    text-shadow: 0 0 20px rgba(255,214,160,.78), 0 0 56px rgba(255,180,100,.42);
    opacity:0;
    transform: translateY(10px);
    transition: opacity 1.1s ease, transform 1.1s ease;
    pointer-events:none;
    z-index: 6;
  }
  .stagetip.on{ opacity:1; transform: translateY(0); }

  .hint{
    position:fixed; left:0; right:0;
    bottom: calc(30px + env(safe-area-inset-bottom));
    text-align:center; pointer-events:none; z-index:5;
    font-size: clamp(10px, 2.9vw, 13px);
    letter-spacing:.32em; text-indent:.32em;
    color: rgba(220,232,255,.50);
    opacity:0; transition:opacity 1s ease;
  }
  .hint.on{ opacity:1; }

  .slotbar{
    position:fixed; left:0; right:0;
    bottom: calc(64px + env(safe-area-inset-bottom));
    display:flex; justify-content:center; gap:13px;
    z-index:5; pointer-events:none;
    opacity:0; transition:opacity 1s ease;
  }
  .slotbar.on{ opacity:1; }
  .slot{
    width:16px; height:16px; line-height:16px;
    text-align:center; font-size:11px;
    color: rgba(220,232,255,.13);
    transition: color .5s ease, text-shadow .5s ease,
                transform .4s cubic-bezier(.2,1.7,.5,1);
  }
  .slot.lit{
    color:#ffdc96;
    text-shadow: 0 0 8px rgba(255,205,120,.95), 0 0 24px rgba(255,175,70,.55);
    transform: scale(1.22);
  }

  .cname{
    position:fixed; left:0; right:0;
    bottom: 24%;
    text-align:center; pointer-events:none; z-index:6;
    opacity:0; transition:opacity 1.8s ease;
  }
  .cname.on{ opacity:1; }
  .cname strong{
    display:block;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    font-weight:400;
    font-size: clamp(18px, 5vw, 28px);
    letter-spacing:.3em; text-indent:.3em;
    color:#fff3d8;
    text-shadow: 0 0 20px rgba(255,214,150,.75), 0 0 56px rgba(255,180,100,.4);
  }
  .cname span{
    display:block;
    margin-top:14px;
    font-size: clamp(9px, 2.6vw, 12px);
    letter-spacing:.42em; text-indent:.42em;
    color: rgba(220,225,245,.42);
  }

  .melody{
    position:fixed; left:0; right:0;
    top: 43%;
    text-align:center; pointer-events:none; z-index:7;
    opacity:0; transition:opacity 2.6s ease;
  }
  .melody.on{ opacity:1; }
  .melody .k{
    display:block;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    font-size: clamp(11px, 3vw, 14px);
    letter-spacing:.5em; text-indent:.5em;
    color: rgba(255,208,230,.55);
    margin-bottom: 18px;
  }
  .melody strong{
    display:block;
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    font-weight:400;
    font-size: clamp(34px, 10vw, 62px);
    letter-spacing:.14em; text-indent:.14em;
    color:#fff2fa;
    text-shadow: 0 0 24px rgba(255,196,226,.95), 0 0 70px rgba(255,150,200,.65), 0 0 140px rgba(255,120,180,.4);
  }

  .melody-img{
    position:fixed;
    left:50%;
    top:25%;
    width: min(80vw, 300px);
    height: auto;
    transform: translate(-50%, -50%);
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: 4;
    filter: drop-shadow(0 0 26px rgba(255, 186, 218, 0.45));
  }
  .melody-img.on{ opacity: 1; }

  .finale{
    position:fixed; left:0; right:0;
    top: 64%;
    padding:0 13%;
    text-align:center;
    pointer-events:none; z-index:6;
    opacity:0; transition:opacity 2.8s ease;
  }
  .finale.on{ opacity:1; }
  .finale p{
    font-family: "Songti SC", "STSong", "SimSun", "Noto Serif SC", serif;
    font-size: clamp(15px, 4.2vw, 24px);
    line-height:2.2;
    letter-spacing:.18em; text-indent:.18em;
    white-space: pre-line;
    color:#fff2d6;
    text-shadow: 0 0 18px rgba(255,210,140,.65), 0 0 52px rgba(255,170,90,.38);
  }

  .stagebar{
    position:fixed; left:0; right:0;
    top: calc(22px + env(safe-area-inset-top));
    display:flex; justify-content:center; gap:6px;
    z-index:5; pointer-events:none;
    opacity:0; transition:opacity 1.4s ease;
  }
  .stagebar.on{ opacity:1; }
  .stagebar i{
    display:block;
    width: 5px; height: 5px; border-radius:50%;
    background: rgba(200,220,255,.18);
    transition: background .6s ease, box-shadow .6s ease, transform .6s ease;
  }
  .stagebar i.done{ background: rgba(255,214,150,.55); }
  .stagebar i.now{
    background:#ffe0a8;
    box-shadow: 0 0 8px rgba(255,200,120,.9);
    transform: scale(1.5);
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<img class="melody-img" id="melodyImgEl" alt="">

<div class="title" id="title">
  <h1>手可摘星辰</h1>
  <p>美乐蒂想要一颗星星，就今晚</p>
</div>

<div class="stagebar" id="stagebar"></div>
<div class="stagetip" id="stagetip"></div>
<div class="hint" id="hint"></div>
<div class="slotbar" id="slotbar"></div>

<div class="cname" id="cname">
  <strong id="cnameText"></strong>
  <span>今夜，它有了名字</span>
</div>

<div class="melody" id="melody">
  <span class="k">认识一下，她叫</span>
  <strong>美乐蒂</strong>
</div>

<div class="finale" id="finale">
  <p id="finaleText"></p>
</div>

<script>
(function () {
'use strict';

/* ============================================================
   基础
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp  = (a, b, t) => a + (b - a) * t;
const rnd   = (a, b) => a + Math.random() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3) / 2;

/* ============================================================
   配置
   ============================================================ */
const CONFIG = {
  slots: 7,
  constellationName: '美乐蒂',
  starName: '美乐蒂',
  endingText: '星星都摘好了\n美乐蒂，晚安',
  melody: [523.25, 523.25, 783.99, 783.99, 880.00, 880.00, 783.99],
  scale:  [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50, 1174.66, 1318.51, 1567.98]
};

/* 星序关卡的五颗星（W 形） */
const CONSTELLATION = {
  nodes: [
    [0.10, 0.22],
    [0.30, 0.44],
    [0.50, 0.20],
    [0.70, 0.44],
    [0.90, 0.22]
  ]
};
const SEQ_NODES = CONSTELLATION.nodes.length;

/* 十个阶段 */
const STAGES = ['intro','point','pick','sequence','rain','gather','gravity','chase','jar','door','melody'];

/* ============================================================
   画布
   ============================================================ */
const canvas = document.getElementById('sky');
const ctx = canvas.getContext('2d', { alpha: false });
let W = 0, H = 0, DPR = 1;

/* ============================================================
   状态
   ============================================================ */
const state = {
  t: 0,
  stage: 'intro',
  stageT: 0,
  stageIdx: 0,
  warmth: 0,
  warmthTarget: 0,
  picked: 0,
  pickCooldown: 0,
  transition: 1
};

/* ============================================================
   指针
   ============================================================ */
const pointer = { x: 0, y: 0, down: false, downX: 0, downY: 0 };

const isCoarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

/* ============================================================
   光团
   ============================================================ */
const orb = {
  x: 0, y: 0,
  tx: 0, ty: 0,
  r: 42,
  alpha: 0,
  idleT: 99,
  flash: 0,
  visible: false
};

/* stars orbiting the orb (caught in stage 4) */
const orbStars = [];

const orbiters = [];
function buildOrbiters() {
  orbiters.length = 0;
  for (let i = 0; i < 34; i++) {
    orbiters.push({
      a: rnd(0, TAU),
      rad: rnd(0.6, 1.9),
      sp: rnd(0.12, 0.5) * (Math.random() < 0.5 ? 1 : -1),
      wob: rnd(0.6, 1.8),
      ph: rnd(0, TAU),
      size: rnd(0.8, 2.0)
    });
  }
}

const trail = [];

/* ============================================================
   星空
   ============================================================ */
let stars = [];
let bgCanvas = null;
const SPR = {};

function makeSprite(r, g, b) {
  const S = 64;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  const grd = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.09, 'rgba(' + r + ',' + g + ',' + b + ',0.98)');
  grd.addColorStop(0.24, 'rgba(' + r + ',' + g + ',' + b + ',0.24)');
  grd.addColorStop(0.50, 'rgba(' + r + ',' + g + ',' + b + ',0.045)');
  grd.addColorStop(1.00, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  x.fillStyle = grd;
  x.fillRect(0, 0, S, S);
  return c;
}

function makeDot(r, g, b) {
  const S = 32;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  const grd = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  grd.addColorStop(0.00, 'rgba(255,255,255,1)');
  grd.addColorStop(0.20, 'rgba(' + r + ',' + g + ',' + b + ',0.90)');
  grd.addColorStop(0.52, 'rgba(' + r + ',' + g + ',' + b + ',0.18)');
  grd.addColorStop(1.00, 'rgba(' + r + ',' + g + ',' + b + ',0)');
  x.fillStyle = grd;
  x.fillRect(0, 0, S, S);
  return c;
}

function buildSprites() {
  SPR.cold = makeSprite(198, 219, 255);
  SPR.warm = makeSprite(255, 231, 186);
  SPR.blue = makeSprite(156, 194, 255);
  SPR.dot = makeDot(255, 224, 172);
  SPR.pink = makeDot(255, 172, 208);
  SPR.white = makeDot(255, 246, 250);
  SPR.dark = makeDot(118, 68, 88);
  SPR.yellow = makeDot(255, 214, 110);
}

function buildBackground() {
  bgCanvas = document.createElement('canvas');
  bgCanvas.width  = Math.round(W * DPR);
  bgCanvas.height = Math.round(H * DPR);
  const g = bgCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);

  const base = g.createLinearGradient(0, 0, W * 0.3, H);
  base.addColorStop(0,    '#050613');
  base.addColorStop(0.42, '#060818');
  base.addColorStop(0.75, '#080619');
  base.addColorStop(1,    '#0a0714');
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);

  g.save();
  g.translate(W * 0.52, H * 0.42);
  g.rotate(-0.44);
  g.scale(1, 0.30);
  const mw = g.createRadialGradient(0, 0, 0, 0, 0, Math.max(W, H) * 1.15);
  mw.addColorStop(0,    'rgba(96,120,222,0.16)');
  mw.addColorStop(0.30, 'rgba(78,96,190,0.085)');
  mw.addColorStop(0.62, 'rgba(58,68,150,0.028)');
  mw.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = mw;
  g.fillRect(-W * 2.5, -H * 5, W * 5, H * 10);
  g.restore();

  const blobs = [
    [0.20, 0.16, 0.40, 'rgba(96,72,190,0.075)'],
    [0.82, 0.30, 0.34, 'rgba(44,96,186,0.065)'],
    [0.38, 0.74, 0.46, 'rgba(126,62,158,0.05)'],
    [0.72, 0.86, 0.30, 'rgba(60,80,170,0.045)']
  ];
  for (let i = 0; i < blobs.length; i++) {
    const b = blobs[i];
    const rr = g.createRadialGradient(W*b[0], H*b[1], 0, W*b[0], H*b[1], Math.min(W,H)*b[2]);
    rr.addColorStop(0, b[3]);
    rr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = rr;
    g.fillRect(0, 0, W, H);
  }

  const vig = g.createRadialGradient(
    W/2, H/2, Math.min(W,H) * 0.20,
    W/2, H/2, Math.max(W,H) * 0.82
  );
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.62)');
  g.fillStyle = vig;
  g.fillRect(0, 0, W, H);
}

function buildStars() {
  stars = [];
  const count = clamp(Math.round(W * H / 1500), 380, 1500);
  for (let i = 0; i < count; i++) {
    const z = Math.pow(Math.random(), 0.68);
    const roll = Math.random();
    stars.push({
      x: rnd(0, W), y: rnd(0, H), z: z,
      r: lerp(0.30, 1.55, z) + rnd(0, 0.25),
      a: rnd(0.20, 0.80) * lerp(0.5, 1, z),
      ph: rnd(0, TAU), sp: rnd(0.35, 1.8),
      ox: 0, oy: 0, dead: false, fade: 1, pull: 0,
      bright: Math.random() < 0.035,
      tint: roll < 0.70 ? 0 : (roll < 0.93 ? 1 : 2)
    });
  }
}

/* ============================================================
   流星
   ============================================================ */
const meteors = [];

function spawnMeteor() {
  const fromLeft = Math.random() < 0.5;
  const x = fromLeft ? rnd(-W*0.1, W*0.55) : rnd(W*0.45, W*1.1);
  const y = rnd(-H*0.05, H*0.42);
  const ang = fromLeft ? rnd(0.28, 0.62) : rnd(Math.PI - 0.62, Math.PI - 0.28);
  const sp = rnd(600, 1100);
  meteors.push({ x, y, vx: Math.cos(ang)*sp, vy: Math.sin(ang)*sp,
    life: 0, maxLife: rnd(0.55, 1.0), len: rnd(80, 210), w: rnd(1.0, 2.0) });
}

function updateMeteors(dt) {
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i];
    m.life += dt; m.x += m.vx*dt; m.y += m.vy*dt;
    if (m.life > m.maxLife || m.x < -320 || m.x > W+320 || m.y > H+320) meteors.splice(i,1);
  }
}

function drawMeteors() {
  for (let i = 0; i < meteors.length; i++) {
    const m = meteors[i];
    const p = m.life / m.maxLife;
    const a = Math.sin(p * Math.PI) * 0.9;
    const nl = Math.hypot(m.vx, m.vy) || 1;
    const tx = m.x - m.vx/nl*m.len, ty = m.y - m.vy/nl*m.len;
    const grd = ctx.createLinearGradient(m.x, m.y, tx, ty);
    grd.addColorStop(0, 'rgba(255,255,255,' + (a*0.95) + ')');
    grd.addColorStop(0.32, 'rgba(200,220,255,' + (a*0.38) + ')');
    grd.addColorStop(1, 'rgba(150,180,255,0)');
    ctx.globalAlpha = 1;
    ctx.strokeStyle = grd; ctx.lineWidth = m.w; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
  }
}

/* ============================================================
   光屑 / 火花
   ============================================================ */
const particles = [];
const sparks = [];

function spawnBurst(x, y, n) {
  n = n || 22;
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), dist = rnd(18, 78);
    particles.push({ x0:x, y0:y, cx:x+Math.cos(a)*dist, cy:y+Math.sin(a)*dist,
      t:-rnd(0,0.14), dur:rnd(0.45,0.9), size:rnd(1.0,2.8) });
  }
}

function updateParticles(dt) {
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt / p.dur;
    if (p.t >= 1) { particles.splice(i,1); orb.flash = Math.min(1.3, orb.flash + 0.12); }
  }
}

function drawParticles() {
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.t < 0) continue;
    const e = p.t*p.t*(3-2*p.t), u = 1-e;
    const x = u*u*p.x0 + 2*u*e*p.cx + e*e*orb.x;
    const y = u*u*p.y0 + 2*u*e*p.cy + e*e*orb.y;
    const a = Math.sin(Math.PI * clamp(p.t,0,1)) * 0.9;
    const s = p.size * (1 - e*0.4);
    ctx.globalAlpha = a;
    ctx.drawImage(SPR.dot, x - s*1.7, y - s*1.7, s*3.4, s*3.4);
  }
}

function spawnSparks(x, y, n, speed) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), sp = rnd(30, speed) * (0.4 + Math.random()*0.6);
    sparks.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp,
      life:rnd(1.0,2.6), maxLife:2.6, size:rnd(0.8,2.6) });
  }
}

function updateSparks(dt) {
  for (let i = sparks.length-1; i >= 0; i--) {
    const s = sparks[i];
    s.life -= dt;
    if (s.life <= 0) { sparks.splice(i,1); continue; }
    s.x += s.vx*dt; s.y += s.vy*dt;
    const damp = Math.pow(0.22, dt);
    s.vx *= damp; s.vy *= damp; s.vy += 10*dt;
  }
}

function drawSparks() {
  for (let i = 0; i < sparks.length; i++) {
    const s = sparks[i];
    const k = s.life / s.maxLife;
    const a = k*k*0.95;
    if (a < 0.01) continue;
    const sz = s.size * (0.4 + k*0.6) * 3.4;
    ctx.globalAlpha = a;
    ctx.drawImage(SPR.dot, s.x - sz/2, s.y - sz/2, sz, sz);
  }
}

/* ============================================================
   音效
   ============================================================ */
let audioCtx = null;
let audioAttempted = false;

function ensureAudio() {
  if (audioCtx) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return;
  }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();
}

function playNote(freq, when, vol, dur) {
  if (!audioCtx) return;
  when = when || 0; vol = vol == null ? 0.2 : vol; dur = dur == null ? 1.5 : dur;
  const now = audioCtx.currentTime + when;

  const o1 = audioCtx.createOscillator();
  o1.type = 'sine'; o1.frequency.value = freq;
  const g1 = audioCtx.createGain();
  g1.gain.setValueAtTime(0.0001, now);
  g1.gain.linearRampToValueAtTime(vol, now + 0.008);
  g1.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  o1.connect(g1); g1.connect(audioCtx.destination);
  o1.start(now); o1.stop(now + dur + 0.06);

  const o2 = audioCtx.createOscillator();
  o2.type = 'sine'; o2.frequency.value = freq * 2.004;
  const g2 = audioCtx.createGain();
  g2.gain.setValueAtTime(0.0001, now);
  g2.gain.linearRampToValueAtTime(vol * 0.26, now + 0.006);
  g2.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.55);
  o2.connect(g2); g2.connect(audioCtx.destination);
  o2.start(now); o2.stop(now + dur * 0.55 + 0.06);
}

function chord(freqs, when, vol, dur) {
  for (let i = 0; i < freqs.length; i++) playNote(freqs[i], (when||0) + i*0.09, vol, dur);
}

const STAGE_TIPS = {
  point:    '星星还在睡觉\n戳一戳',
  pick:     '伸伸手\n它们会自己跳进来',
  sequence: '一颗一颗\n全部点亮',
  rain:     '接住！\n别让它们摔着',
  gather:   '按住按住\n光要跑掉啦',
  gravity:  '用光把星星\n推回家',
  chase:    '抓住\n那颗小淘气',

};

const stagetipEl = document.getElementById('stagetip');
let stagetipTimer = null;

function showStageTip(text, ms) {
  stagetipEl.textContent = text;
  stagetipEl.classList.add('on');
  clearTimeout(stagetipTimer);
  stagetipTimer = setTimeout(function () {
    stagetipEl.classList.remove('on');
  }, ms || 2600);
}

let hintTimer = null;
function showHint(text, ms) {
  hintEl.textContent = text;
  hintEl.classList.add('on');
  clearTimeout(hintTimer);
  if (ms) hintTimer = setTimeout(function(){ hintEl.classList.remove('on'); }, ms);
}

function updateStageDots() {
  const idx = STAGES.indexOf(state.stage);
  for (let i = 0; i < stageDots.length; i++) {
    stageDots[i].className = i < idx ? 'done' : (i === idx ? 'now' : '');
  }
}

/* ============================================================
   阶段管理
   ============================================================ */
const stageImpl = {};

let stageInitTimer = null;

function enterStage(id) {
  state.stage = id;
  state.stageT = 0;
  state.stageIdx = STAGES.indexOf(id);
  state.transition = 0;
  hintEl.classList.remove('on');
  titleEl.classList.remove('on');
  clearTimeout(hintTimer);
  clearTimeout(stagetipTimer);
  stagetipEl.classList.remove('on');
  updateStageDots();

  const tip = STAGE_TIPS[id];
  if (tip) {
    showStageTip(tip, 2100);
    state.intro = true;
    clearTimeout(stageInitTimer);
    stageInitTimer = setTimeout(function () {
      if (state.stage !== id) return;
      state.intro = false;
      state.stageT = 0;
      if (stageImpl[id] && stageImpl[id].init) stageImpl[id].init();
    }, 2000);
  } else {
    state.intro = false;
    if (stageImpl[id] && stageImpl[id].init) stageImpl[id].init();
  }
}

function nextStage() {
  const i = STAGES.indexOf(state.stage);
  if (i < STAGES.length - 1) enterStage(STAGES[i + 1]);
}

stageImpl.point = {
  spots: [],
  lit: 0,
  init() {
    this.spots = [];
    this.lit = 0;
    state.warmthTarget = 0.08;
    orb.visible = false;
    const n = 9;
    const R = Math.min(W, H) * 0.30;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI/2 + i / n * TAU;
      this.spots.push({
        x: W * 0.5 + Math.cos(a) * R,
        y: H * 0.44 + Math.sin(a) * R,
        lit: false, pulse: 0, ph: rnd(0, TAU)
      });
    }
  },
  update(dt) {
    for (let i = 0; i < this.spots.length; i++) {
      const s = this.spots[i];
      if (s.lit) s.pulse = Math.min(1, s.pulse + dt * 1.6);
    }
  },
  render() {
    const t = state.t;
    for (let i = 0; i < this.spots.length; i++) {
      const s = this.spots[i];
      const tw = 0.5 + 0.5 * Math.sin(t * 1.4 + s.ph);
      if (s.lit) {
        const gr = 24 + s.pulse * 14;
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, gr);
        g.addColorStop(0, 'rgba(255,250,236,0.95)');
        g.addColorStop(0.25, 'rgba(255,222,160,0.40)');
        g.addColorStop(1, 'rgba(255,190,110,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(s.x, s.y, gr, 0, TAU); ctx.fill();
        const sz = 14;
        ctx.drawImage(SPR.warm, s.x - sz/2, s.y - sz/2, sz, sz);
      } else {
        ctx.globalAlpha = 0.35 + 0.25 * tw;
        ctx.strokeStyle = 'rgba(170,196,240,0.9)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(s.x, s.y, 9, 0, TAU); ctx.stroke();
        ctx.globalAlpha = 0.25 + 0.2 * tw;
        ctx.fillStyle = 'rgba(180,205,255,1)';
        ctx.beginPath(); ctx.arc(s.x, s.y, 2.4, 0, TAU); ctx.fill();
      }
    }

    // 星环连线
    if (this.lit > 1) {
      ctx.globalAlpha = 0.12;
      ctx.strokeStyle = 'rgba(200,220,255,1)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      for (let i = 0; i < this.spots.length; i++) {
        const a = this.spots[i], b = this.spots[(i+1) % this.spots.length];
        if (a.lit && b.lit) { ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); }
      }
      ctx.stroke();
    }
  },
  tap(x, y) {
    if (state.stageT < 0.6) return;
    for (let i = 0; i < this.spots.length; i++) {
      const s = this.spots[i];
      if (!s.lit && Math.hypot(s.x - x, s.y - y) < 62) {
        s.lit = true;
        this.lit++;
        playNote(CONFIG.scale[Math.min(i, 8)], 0, 0.14, 1.3);
        if (this.lit >= this.spots.length) {
          chord([783.99, 987.77, 1174.66], 0.1, 0.10, 2.4);
          setTimeout(function(){ if (state.stage === 'point') nextStage(); }, 2100);
        }
        return;
      }
    }
  }
};

/* ============================================================
   2 · 摘星
   ============================================================ */
stageImpl.pick = {
  init() {
    state.warmthTarget = 0.22;
    state.picked = 0;
    for (let i = 0; i < slotEls.length; i++) slotEls[i].classList.remove('lit');
    slotbar.classList.add('on');
    orb.visible = true;
    orb.tx = W * 0.5; orb.ty = H * 0.62;
    buildStars();
  },
  update(dt) {
    const canPick = state.picked < CONFIG.slots && state.pickCooldown <= 0;
    const pickR = orb.r * 0.85;
    let best = null, bestD = Infinity;

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (s.dead) { s.fade -= dt * 2.6; continue; }
      const dx = orb.x - s.x, dy = orb.y - s.y;
      const dist = Math.hypot(dx, dy);
      const R = 130 + 170 * s.z;
      if (dist < R && dist > 0.001) {
        const f = 1 - dist / R;
        s.pull = f;
        const pull = f * f * (24 + 34 * s.z);
        s.ox += ((dx/dist)*pull - s.ox) * Math.min(1, dt*9);
        s.oy += ((dy/dist)*pull - s.oy) * Math.min(1, dt*9);
      } else {
        s.pull = 0;
        s.ox *= Math.pow(0.02, dt); s.oy *= Math.pow(0.02, dt);
      }
      if (canPick && s.z > 0.30) {
        const sx = s.x + s.ox, sy = s.y + s.oy;
        const d = Math.hypot(orb.x - sx, orb.y - sy);
        if (d < pickR && d < bestD) { bestD = d; best = s; }
      }
    }

    if (best) {
      best.dead = true;
      spawnBurst(best.x + best.ox, best.y + best.oy);
      orb.flash = Math.min(1.15, orb.flash + 0.5);
      state.pickCooldown = 0.55;
      const idx = state.picked;
      slotEls[idx].classList.add('lit');
      playNote(CONFIG.melody[idx], 0, 0.18, 1.6);
      state.picked++;
      if (state.picked >= CONFIG.slots) {
        slotbar.classList.remove('on');
        setTimeout(function(){ if (state.stage === 'pick') nextStage(); }, 900);
      }
    }
    state.pickCooldown = Math.max(0, state.pickCooldown - dt);
  },
  render() {}
};

/* ============================================================
   3 · 星序（把五颗星全部点亮）
   ============================================================ */
function constellationPoint(i) {
  const n = CONSTELLATION.nodes[i];
  return { x: W*0.07 + n[0]*W*0.86, y: H*0.24 + n[1]*H*0.40 };
}

stageImpl.sequence = {
  flyers: [],
  lit: [],
  litCount: 0,
  ready: false,
  done: false,
  doneT: 0,
  flashIdx: -1,
  flashT: 0,

  init() {
    state.warmthTarget = 0.36;
    this.lit = [];
    for (let i = 0; i < SEQ_NODES; i++) this.lit.push(false);
    this.litCount = 0;
    this.ready = false;
    this.done = false;
    this.doneT = 0;
    this.flashIdx = -1;
    this.flashT = 0;
    orb.visible = false;

    this.flyers = [];
    const bx = orb.x, by = orb.y;
    for (let i = 0; i < SEQ_NODES; i++) {
      const p = constellationPoint(i);
      this.flyers.push({
        fromX: bx + rnd(-26,26), fromY: by + rnd(-26,26),
        cx: (bx+p.x)/2 + rnd(-W*0.14, W*0.14),
        cy: (by+p.y)/2 + rnd(-H*0.14, H*0.10),
        toX: p.x, toY: p.y,
        t: -i*0.10, dur: 1.05
      });
    }
    orb.tx = W*0.5; orb.ty = H*0.80;
  },

  update(dt) {
    for (let i = 0; i < this.flyers.length; i++) this.flyers[i].t += dt / this.flyers[i].dur;

    this.flashT = Math.max(0, this.flashT - dt);

    if (!this.ready) {
      let landed = true;
      for (let i = 0; i < this.flyers.length; i++) {
        if (this.flyers[i].t < 1) { landed = false; break; }
      }
      if (landed) {
        this.ready = true;
        showHint('点一点，让它们都亮起来', 6000);
      }
      return;
    }

    if (this.done) this.doneT += dt;
  },

  tap(x, y) {
    if (!this.ready || this.done) return;

    let hit = -1;
    for (let i = 0; i < SEQ_NODES; i++) {
      if (this.lit[i]) continue;
      const p = constellationPoint(i);
      if (Math.hypot(p.x - x, p.y - y) < 56) { hit = i; break; }
    }
    if (hit < 0) return;

    this.lit[hit] = true;
    this.litCount++;
    this.flashIdx = hit;
    this.flashT = 0.35;

    const p = constellationPoint(hit);
    spawnBurst(p.x, p.y, 15);
    playNote(CONFIG.scale[hit], 0, 0.16, 1.1);

    if (this.litCount >= SEQ_NODES) {
      this.done = true;
      this.doneT = 0;
      showHint('', 1);
      spawnSparks(W*0.5, H*0.40, 44, 190);
      cnameEl.classList.add('on');
      chord([1046.50, 1318.51, 1567.98], 0.1, 0.09, 2.8);
      setTimeout(function(){
        if (state.stage === 'sequence') { cnameEl.classList.remove('on'); nextStage(); }
      }, 3600);
    }
  },

  render() {
    const t = state.t;

    // 全部点亮后，把五颗星连起来
    if (this.done && this.doneT > 0) {
      const prog = easeOut(clamp(this.doneT / 0.9, 0, 1)) * (SEQ_NODES - 1);
      ctx.beginPath();
      const p0 = constellationPoint(0);
      ctx.moveTo(p0.x, p0.y);
      let drew = false;
      for (let i = 1; i < SEQ_NODES; i++) {
        const seg = clamp(prog - (i - 1), 0, 1);
        if (seg <= 0) break;
        const a = constellationPoint(i - 1), b = constellationPoint(i);
        ctx.lineTo(lerp(a.x, b.x, seg), lerp(a.y, b.y, seg));
        drew = true;
      }
      if (drew) {
        ctx.lineCap = 'round';
        ctx.globalAlpha = 0.16;
        ctx.strokeStyle = 'rgba(255,214,150,1)';
        ctx.lineWidth = 7;
        ctx.stroke();
        ctx.globalAlpha = 0.75;
        ctx.strokeStyle = 'rgba(255,236,200,1)';
        ctx.lineWidth = 1.6;
        ctx.stroke();
      }
    }

    for (let i = 0; i < SEQ_NODES; i++) {
      const p = constellationPoint(i);
      const tw = 0.55 + 0.45 * Math.sin(t*1.6 + i*1.1);
      const isLit = this.lit[i];
      const flash = isLit && this.flashIdx === i ? this.flashT : 0;

      if (isLit) {
        const gr = 36 + flash * 40;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, gr);
        g.addColorStop(0, 'rgba(255,250,236,0.98)');
        g.addColorStop(0.3, 'rgba(255,220,160,0.42)');
        g.addColorStop(1, 'rgba(255,180,100,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x, p.y, gr, 0, TAU); ctx.fill();

        const s = 16;
        ctx.globalAlpha = 1;
        ctx.drawImage(SPR.warm, p.x-s/2, p.y-s/2, s, s);
      } else {
        const s = 14 + 4 * tw;
        ctx.globalAlpha = 0.45 + 0.35 * tw;
        ctx.drawImage(SPR.cold, p.x-s/2, p.y-s/2, s, s);
        ctx.globalAlpha = 0.12 + 0.10 * tw;
        ctx.strokeStyle = 'rgba(170,200,255,1)';
        ctx.lineWidth = 0.8;
        ctx.beginPath(); ctx.arc(p.x, p.y, 23 + 2*Math.sin(t*2 + i), 0, TAU); ctx.stroke();
      }
    }

    for (let i = 0; i < this.flyers.length; i++) {
      const f = this.flyers[i];
      if (f.t < 0) continue;
      const e = easeInOut(clamp(f.t,0,1)), u = 1-e;
      const x = u*u*f.fromX + 2*u*e*f.cx + e*e*f.toX;
      const y = u*u*f.fromY + 2*u*e*f.cy + e*e*f.toY;
      ctx.globalAlpha = 1;
      ctx.drawImage(SPR.warm, x-8, y-8, 16, 16);
    }

    if (!this.done && this.ready) {
      for (let i = 0; i < SEQ_NODES; i++) {
        const x = W*0.5 + (i - (SEQ_NODES-1)/2) * 20;
        const y = H*0.90;
        ctx.globalAlpha = i < this.litCount ? 0.9 : 0.16;
        ctx.drawImage(SPR.dot, x-3.5, y-3.5, 7, 7);
      }
    }
  }
};

/* ============================================================
   4 · 星雨
   ============================================================ */
stageImpl.rain = {
  list: [], caught: 0, timer: 0,
  init() {
    state.warmthTarget = 0.48;
    this.list = []; this.caught = 0; this.timer = 0.6;
    orb.visible = true;
    orb.tx = W*0.5; orb.ty = H*0.80;
  },
  update(dt) {
    if (state.stageT < 0.9) return;
    this.timer -= dt;
    if (this.timer <= 0 && this.caught + this.list.length < 9) {
      this.list.push({
        x: rnd(W*0.12, W*0.88), y: -50,
        vy: rnd(145, 235), r: rnd(2.4, 3.6), ph: rnd(0, TAU)
      });
      this.timer = rnd(0.30, 0.50);
    }
    for (let i = this.list.length-1; i >= 0; i--) {
      const s = this.list[i];
      s.y += s.vy * dt;
      if (s.y > H + 40) this.list.splice(i,1);
    }
  },
  render() {
    const t = state.t;
    for (let i = 0; i < this.list.length; i++) {
      const s = this.list[i];
      const sz = s.r * 12;
      const gr = sz * 1.45;

      // 光晕，让下落的目标更醒目
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, gr);
      g.addColorStop(0, 'rgba(255,242,212,0.34)');
      g.addColorStop(0.45, 'rgba(255,214,150,0.13)');
      g.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, gr, 0, TAU); ctx.fill();

      ctx.globalAlpha = 0.95;
      ctx.drawImage(SPR.warm, s.x-sz/2, s.y-sz/2, sz, sz);

      // 拖尾
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = 'rgba(255,220,160,1)';
      ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y-34); ctx.stroke();
    }

    for (let i = 0; i < this.caught; i++) {
      const a = -Math.PI*0.5 + i * 0.62;
      const r = orb.r * 2.1;
      const x = orb.x + Math.cos(a) * r;
      const y = orb.y + Math.sin(a) * r * 0.7;
      ctx.globalAlpha = 0.9;
      ctx.drawImage(SPR.warm, x-9, y-9, 18, 18);
    }
  },
  tap(x, y) {
    for (let i = this.list.length-1; i >= 0; i--) {
      const s = this.list[i];
      if (Math.hypot(s.x-x, s.y-y) < 80) {
        this.list.splice(i,1);
        this.caught++;
        spawnBurst(s.x, s.y, 12);
        playNote(CONFIG.scale[Math.min(this.caught, 8)], 0, 0.13, 1.1);
        if (this.caught >= 9) {
          chord([880.00, 1108.73, 1318.51], 0.05, 0.09, 2.2);
          setTimeout(function(){ if (state.stage === 'rain') nextStage(); }, 1500);
        }
        return;
      }
    }
  }
};

/* ============================================================
   5 · 聚星
   ============================================================ */
stageImpl.gather = {
  dust: [], energy: 0,
  init() {
    state.warmthTarget = 0.56;
    this.dust = []; this.energy = 0;
    for (let i = 0; i < 150; i++) {
      this.dust.push({
        x: rnd(0, W), y: rnd(0, H),
        vx: 0, vy: 0,
        size: rnd(0.7, 1.9),
        ph: rnd(0, TAU)
      });
    }
    pointer.x = W*0.5; pointer.y = H*0.55;
  },
  update(dt) {
    const cx = pointer.x, cy = pointer.y;
    let near = 0;

    for (let i = 0; i < this.dust.length; i++) {
      const d = this.dust[i];
      if (pointer.down) {
        const dx = cx - d.x, dy = cy - d.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 420) {
          const f = 1 - dist / 420;
          d.vx += dx/(dist+1) * f * 1400 * dt;
          d.vy += dy/(dist+1) * f * 1400 * dt;
        }
      }
      d.vx *= Math.pow(0.55, dt);
      d.vy *= Math.pow(0.55, dt);
      d.x += d.vx * dt;
      d.y += d.vy * dt;
      if (Math.hypot(cx-d.x, cy-d.y) < 55) near++;
    }

    if (pointer.down) {
      this.energy = Math.min(1, this.energy + near * dt * 0.035);
    } else {
      this.energy = Math.max(0, this.energy - dt * 0.06);
    }

    if (this.energy >= 1 && state.stageT > 1) {
      this.energy = 1;
      if (!this.done) {
        this.done = true;
        spawnSparks(cx, cy, 70, 220);
        chord([659.25, 880.00, 1046.50], 0, 0.10, 2.6);
        showHint('', 1);
        setTimeout(function(){ if (state.stage === 'gather') nextStage(); }, 1900);
      }
    }
  },
  render() {
    for (let i = 0; i < this.dust.length; i++) {
      const d = this.dust[i];
      const tw = 0.5 + 0.5 * Math.sin(state.t*1.7 + d.ph);
      const s = d.size * 6;
      ctx.globalAlpha = 0.20 + tw * 0.45;
      ctx.drawImage(SPR.dot, d.x-s/2, d.y-s/2, s, s);
    }

    if (this.energy > 0.01) {
      const r = 30 + this.energy * 70;
      const g = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, r);
      g.addColorStop(0, 'rgba(255,250,235,' + (0.7*this.energy) + ')');
      g.addColorStop(0.35, 'rgba(255,220,160,' + (0.28*this.energy) + ')');
      g.addColorStop(1, 'rgba(255,180,100,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, r, 0, TAU); ctx.fill();
    }

    // 进度环
    if (this.energy > 0.02) {
      ctx.globalAlpha = 0.5;
      ctx.strokeStyle = 'rgba(255,224,170,1)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, 96, -Math.PI/2, -Math.PI/2 + TAU*this.energy);
      ctx.stroke();
    }
  }
};

stageImpl.gravity = {
  star: null,
  targets: [],
  cur: 0,
  done: false,
  trail: [],

  init() {
    state.warmthTarget = 0.64;
    this.star = { x: W*0.5, y: H*0.52, vx: 0, vy: 0 };
    this.targets = [
      { x: W*0.22, y: H*0.26, r: 48, done: false },
      { x: W*0.78, y: H*0.32, r: 48, done: false },
      { x: W*0.50, y: H*0.74, r: 48, done: false }
    ];
    this.cur = 0;
    this.done = false;
    this.trail = [];
    orb.tx = W*0.5; orb.ty = H*0.88;
    orb.x = W*0.5; orb.y = H*0.88;
  },

  update(dt) {
    if (this.done) return;
    const s = this.star;

    const dx = s.x - orb.x;
    const dy = s.y - orb.y;
    const dist = Math.hypot(dx, dy) || 1;

    if (dist < 240) {
      const f = (1 - dist/240) * 400;
      s.vx += dx/dist * f * dt;
      s.vy += dy/dist * f * dt;
    }

    s.vx *= Math.pow(0.16, dt);
    s.vy *= Math.pow(0.16, dt);

    s.x += s.vx * dt;
    s.y += s.vy * dt;

    const m = 34;
    if (s.x < m) { s.x = m; s.vx = Math.abs(s.vx)*0.55; }
    if (s.x > W-m) { s.x = W-m; s.vx = -Math.abs(s.vx)*0.55; }
    if (s.y < m) { s.y = m; s.vy = Math.abs(s.vy)*0.55; }
    if (s.y > H-m) { s.y = H-m; s.vy = -Math.abs(s.vy)*0.55; }

    this.trail.push({ x: s.x, y: s.y, life: 1 });
    if (this.trail.length > 22) this.trail.shift();
    for (let i = this.trail.length-1; i >= 0; i--) {
      this.trail[i].life -= dt * 2.4;
      if (this.trail[i].life <= 0) this.trail.splice(i, 1);
    }

    const tg = this.targets[this.cur];
    if (tg && Math.hypot(s.x - tg.x, s.y - tg.y) < tg.r) {
      tg.done = true;
      spawnSparks(tg.x, tg.y, 44, 210);
      playNote(CONFIG.scale[this.cur*3 + 2], 0, 0.14, 1.4);
      this.cur++;
      if (this.cur >= this.targets.length) {
        this.done = true;
        chord([880.00, 1108.73, 1318.51], 0, 0.09, 2.4);
        showHint('', 1);
        setTimeout(function(){ if (state.stage === 'gravity') nextStage(); }, 1800);
      } else {
        s.x = W*0.5; s.y = H*0.52; s.vx = 0; s.vy = 0;
        this.trail = [];
      }
    }
  },

  render() {
    const t = state.t;

    for (let i = 0; i < this.targets.length; i++) {
      const tg = this.targets[i];
      const isCur = i === this.cur;
      const pulse = 1 + Math.sin(t*2 + i)*0.06;

      ctx.globalAlpha = tg.done ? 0.45 : (isCur ? 0.85 : 0.16);
      ctx.strokeStyle = tg.done ? 'rgba(160,250,196,0.9)' :
                        (isCur ? 'rgba(255,226,176,1)' : 'rgba(170,200,255,0.8)');
      ctx.lineWidth = isCur ? 2 : 1.2;
      ctx.setLineDash(isCur ? [6, 8] : [4, 10]);
      ctx.lineDashOffset = -t * 18;
      ctx.beginPath();
      ctx.arc(tg.x, tg.y, tg.r * pulse, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);

      if (isCur) {
        const g = ctx.createRadialGradient(tg.x, tg.y, 0, tg.x, tg.y, tg.r);
        g.addColorStop(0, 'rgba(255,230,190,0.12)');
        g.addColorStop(1, 'rgba(255,190,110,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(tg.x, tg.y, tg.r, 0, TAU); ctx.fill();
      }
    }

    for (let i = 0; i < this.trail.length; i++) {
      const p = this.trail[i];
      const a = p.life * 0.5;
      const s = 8 * p.life;
      ctx.globalAlpha = a;
      ctx.drawImage(SPR.dot, p.x-s/2, p.y-s/2, s, s);
    }

    if (this.star) {
      const s = this.star;
      const gr = 44;
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, gr);
      g.addColorStop(0, 'rgba(255,250,236,0.95)');
      g.addColorStop(0.3, 'rgba(255,220,160,0.38)');
      g.addColorStop(1, 'rgba(255,180,100,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, gr, 0, TAU); ctx.fill();

      const sz = 18;
      ctx.drawImage(SPR.warm, s.x-sz/2, s.y-sz/2, sz, sz);
    }

    for (let i = 0; i < 3; i++) {
      const x = W*0.5 + (i-1)*18;
      const y = H*0.93;
      ctx.globalAlpha = i < this.cur ? 0.9 : 0.16;
      ctx.drawImage(SPR.dot, x-3.5, y-3.5, 7, 7);
    }
  }
};

stageImpl.chase = {
  sx: 0, sy: 0, vx: 0, vy: 0, hits: 0, cool: 0,
  init() {
    state.warmthTarget = 0.70;
    this.sx = W*0.5; this.sy = H*0.30;
    this.vx = 90; this.vy = 60;
    this.hits = 0; this.cool = 0;
  },
  update(dt) {
    const dx = orb.x - this.sx, dy = orb.y - this.sy;
    const dist = Math.hypot(dx, dy) || 1;

    if (dist < 170) {
      const f = (1 - dist/170) * 340;
      this.vx -= dx/dist * f * dt;
      this.vy -= dy/dist * f * dt;
    }

    const sp = Math.hypot(this.vx, this.vy);
    const maxSp = 300;
    if (sp > maxSp) { this.vx = this.vx/sp*maxSp; this.vy = this.vy/sp*maxSp; }

    this.vx *= Math.pow(0.90, dt);
    this.vy *= Math.pow(0.90, dt);

    if (Math.hypot(this.vx, this.vy) < 60) {
      this.vx += rnd(-120, 120);
      this.vy += rnd(-120, 120);
    }

    this.sx += this.vx * dt;
    this.sy += this.vy * dt;

    if (this.sx < W*0.10) { this.sx = W*0.10; this.vx = Math.abs(this.vx); }
    if (this.sx > W*0.90) { this.sx = W*0.90; this.vx = -Math.abs(this.vx); }
    if (this.sy < H*0.16) { this.sy = H*0.16; this.vy = Math.abs(this.vy); }
    if (this.sy > H*0.82) { this.sy = H*0.82; this.vy = -Math.abs(this.vy); }

    this.cool = Math.max(0, this.cool - dt);

    if (dist < 54 && this.cool <= 0) {
      this.hits++;
      this.cool = 0.9;
      spawnBurst(this.sx, this.sy, 14);
      playNote(CONFIG.scale[Math.min(this.hits*2, 8)], 0, 0.14, 1.2);
      this.vx *= -1.4; this.vy *= -1.4;

      if (this.hits >= 3) {
        chord([880.00, 1108.73, 1318.51], 0, 0.09, 2.2);
        showHint('', 1);
        setTimeout(function(){ if (state.stage === 'chase') nextStage(); }, 1500);
      }
    }
  },
  render() {
    const t = state.t;
    const gr = 46;
    const g = ctx.createRadialGradient(this.sx, this.sy, 0, this.sx, this.sy, gr);
    g.addColorStop(0, 'rgba(255,250,236,0.95)');
    g.addColorStop(0.3, 'rgba(255,214,150,0.35)');
    g.addColorStop(1, 'rgba(255,180,100,0)');
    ctx.globalAlpha = 1; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(this.sx, this.sy, gr, 0, TAU); ctx.fill();

    const s = 17;
    ctx.drawImage(SPR.warm, this.sx-s/2, this.sy-s/2, s, s);

    // 拖尾
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = 'rgba(255,220,160,1)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(this.sx, this.sy);
    ctx.lineTo(this.sx - this.vx*0.12, this.sy - this.vy*0.12);
    ctx.stroke();

    // 撞到的次数
    for (let i = 0; i < 3; i++) {
      const x = W*0.5 + (i-1) * 26;
      const y = H*0.92;
      ctx.globalAlpha = i < this.hits ? 0.9 : 0.18;
      ctx.drawImage(SPR.dot, x-4, y-4, 8, 8);
    }
  }
};

   ============================================================ */
const jar = { x:0, y:0, w:0, h:0, targetY:0, alpha:0, lid:0, glow:0, scale:1 };
const jarStars = [];
const jarDust = [];

function initJar() {
  jar.w = Math.min(W*0.48, 215);
  jar.h = jar.w * 1.45;
  jar.x = W*0.5;
  jar.y = H + jar.h;
  jar.targetY = H*0.66;
  jar.alpha = 0; jar.lid = 0; jar.glow = 0; jar.scale = 1;
  jarStars.length = 0; jarDust.length = 0;
  for (let i = 0; i < 28; i++) {
    jarDust.push({ x:rnd(-0.33,0.33), y:rnd(-0.37,0.37), r:rnd(0.5,1.3), ph:rnd(0,TAU), sp:rnd(0.5,1.6) });
  }
}

stageImpl.jar = {
  poured: 0,
  init() {
    state.warmthTarget = 0.78;
    initJar();
    this.poured = 0;
    orb.tx = W*0.5; orb.ty = H*0.34;
  },
  update(dt) {
    jar.alpha = Math.min(1, jar.alpha + dt*0.8);
    jar.y = lerp(jar.y, jar.targetY, 1 - Math.pow(0.02, dt));

    const mouth = { x: jar.x, y: jar.y - jar.h*0.5 + 10 };

    if (this.poured < 9 && Math.hypot(orb.x - mouth.x, orb.y - mouth.y) < 130) {
      this.poured++;
      const tx = jar.x + rnd(-jar.w*0.32, jar.w*0.32);
      const ty = jar.targetY + rnd(-jar.h*0.20, jar.h*0.22);
      const startX = orb.x + rnd(-20,20), startY = orb.y + rnd(-20,20);
      jarStars.push({
        x: startX, y: startY,
        fromX: startX, fromY: startY,
        toX: tx, toY: ty,
        cx: (startX+tx)/2 + rnd(-50,50),
        cy: Math.min(startY, ty) - rnd(20, 70),
        flyT: 0, flyDur: 0.75,
        vx: 0, vy: 0,
        r: rnd(2.0, 3.4),
        ph: rnd(0,TAU), sp: rnd(0.8,2.0)
      });
      playNote(CONFIG.scale[Math.min(this.poured, 8)], 0, 0.10, 1.0);
    }

    // 物理
    const halfW = jar.w*0.5 - 12;
    const top = jar.y - jar.h*0.5 + 30;
    const bottom = jar.y + jar.h*0.5 - 16;

    for (let i = 0; i < jarStars.length; i++) {
      const s = jarStars[i];
      if (s.flyT < 1) {
        s.flyT += dt / s.flyDur;
        const e = easeInOut(clamp(s.flyT,0,1)), u = 1-e;
        s.x = u*u*s.fromX + 2*u*e*s.cx + e*e*s.toX;
        s.y = u*u*s.fromY + 2*u*e*s.cy + e*e*s.toY;
        continue;
      }
      s.vx += Math.cos(state.t*0.7 + s.ph*1.3) * 13 * dt;
      s.vy += Math.sin(state.t*0.9 + s.ph) * 15 * dt;
      s.vx *= Math.pow(0.55, dt);
      s.vy *= Math.pow(0.55, dt);
      s.x += s.vx*dt; s.y += s.vy*dt;
      if (s.x < jar.x-halfW) { s.x = jar.x-halfW; s.vx = Math.abs(s.vx)*0.65; }
      if (s.x > jar.x+halfW) { s.x = jar.x+halfW; s.vx = -Math.abs(s.vx)*0.65; }
      if (s.y > bottom) { s.y = bottom; s.vy = -Math.abs(s.vy)*0.6; }
      if (s.y < top) { s.y = top; s.vy = Math.abs(s.vy)*0.6; }
    }

    jar.glow = Math.min(1, jar.glow + (this.poured/9) * dt * 0.9);

    if (this.poured >= 9 && state.stageT > 2.5) {
      jar.lid = Math.min(1, jar.lid + dt*0.7);
      if (jar.lid >= 1 && state.stageT > 4.2) {
        showHint('', 1);
        nextStage();
      }
    }
  },
  render() {
    if (jar.alpha <= 0.01) return;
    const w = jar.w * jar.scale, h = jar.h * jar.scale;
    const x = jar.x - w/2, y = jar.y - h/2;
    const r = w * 0.22;

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = jar.alpha;

    const innerGlow = ctx.createRadialGradient(jar.x, jar.y+h*0.05, 0, jar.x, jar.y+h*0.05, w*0.85);
    const ga = 0.06 + jar.glow*0.17;
    innerGlow.addColorStop(0, 'rgba(255,214,150,' + ga + ')');
    innerGlow.addColorStop(0.55, 'rgba(255,180,100,' + (ga*0.38) + ')');
    innerGlow.addColorStop(1, 'rgba(255,160,80,0)');
    ctx.fillStyle = innerGlow;
    ctx.fillRect(x, y, w, h);

    for (let i = 0; i < jarDust.length; i++) {
      const d = jarDust[i];
      const dx = jar.x + d.x*w, dy = jar.y + d.y*h;
      const sz = d.r * 6 * jar.scale;
      const tw = 0.30 + 0.40*Math.sin(state.t*d.sp + d.ph);
      ctx.globalAlpha = jar.alpha * Math.max(0.05, tw);
      ctx.drawImage(SPR.dot, dx-sz/2, dy-sz/2, sz, sz);
    }

    for (let i = 0; i < jarStars.length; i++) {
      const s = jarStars[i];
      const tw = 0.6 + 0.4*Math.sin(state.t*s.sp + s.ph);
      const sz = s.r * 11 * jar.scale;
      ctx.globalAlpha = jar.alpha * tw;
      ctx.drawImage(SPR.warm, s.x-sz/2, s.y-sz/2, sz, sz);
    }

    const body = new Path2D();
    roundRect(body, x, y, w, h, r);
    ctx.globalAlpha = jar.alpha * 0.05;
    ctx.fillStyle = 'rgba(170,210,255,1)';
    ctx.fill(body);
    ctx.globalAlpha = jar.alpha * 0.55;
    ctx.strokeStyle = 'rgba(196,226,255,0.8)';
    ctx.lineWidth = 1.4;
    ctx.stroke(body);

    ctx.globalAlpha = jar.alpha * 0.16;
    const inner = new Path2D();
    roundRect(inner, x+7, y+7, w-14, h-14, Math.max(4, r-5));
    ctx.strokeStyle = 'rgba(210,234,255,0.9)';
    ctx.lineWidth = 0.8;
    ctx.stroke(inner);

    const hlx = x + w*0.155;
    const hlg = ctx.createLinearGradient(0, y+h*0.12, 0, y+h*0.78);
    hlg.addColorStop(0, 'rgba(255,255,255,0)');
    hlg.addColorStop(0.22, 'rgba(255,255,255,0.60)');
    hlg.addColorStop(0.68, 'rgba(255,255,255,0.30)');
    hlg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = jar.alpha;
    ctx.strokeStyle = hlg; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.shadowColor = 'rgba(215,238,255,0.6)'; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.moveTo(hlx, y+h*0.16); ctx.lineTo(hlx, y+h*0.58); ctx.stroke();
    ctx.shadowBlur = 0;

    const lidH = h*0.085, lidW = w*0.70;
    const lidY = y - lidH*0.65 - (1-jar.lid) * h*0.45;
    ctx.globalAlpha = jar.alpha * Math.min(1, jar.lid*1.8);
    const lid = new Path2D();
    roundRect(lid, jar.x-lidW/2, lidY, lidW, lidH, lidH*0.42);
    const lg = ctx.createLinearGradient(0, lidY, 0, lidY+lidH);
    lg.addColorStop(0, 'rgba(255,238,200,0.80)');
    lg.addColorStop(0.5, 'rgba(244,204,144,0.60)');
    lg.addColorStop(1, 'rgba(206,164,104,0.35)');
    ctx.fillStyle = lg; ctx.fill(lid);
    ctx.strokeStyle = 'rgba(255,246,224,0.85)';
    ctx.lineWidth = 1; ctx.stroke(lid);

    ctx.restore();
  }
};

stageImpl.door = {
  doorOpen: 0, offered: false,
  init() {
    state.warmthTarget = 0.88;
    this.doorOpen = 0;
    this.offered = false;
    jar.targetY = H*0.66;
    orb.tx = W*0.5; orb.ty = H*0.78;
    orb.x = W*0.5; orb.y = H*0.78;
  },
  update(dt) {
    // 罐子跟随光团（被"捧"着）
    jar.x = lerp(jar.x, orb.x, 1 - Math.pow(0.08, dt));
    jar.y = lerp(jar.y, clamp(orb.y - 20, H*0.34, H*0.86), 1 - Math.pow(0.08, dt));
    jar.alpha = Math.min(1, jar.alpha + dt*0.8);

    const jarTop = jar.y - jar.h*0.5;
    const doorY = H*0.40;

    if (jarTop < doorY + 60 && !this.offered) {
      this.offered = true;
      chord([1046.50, 1318.51, 1567.98, 2093.00], 0, 0.09, 3.2);
      showHint('', 1);
    }

    if (this.offered) {
      this.doorOpen = Math.min(1, this.doorOpen + dt*0.6);
      state.warmthTarget = 1.0;
      if (this.doorOpen >= 1 && state.stageT > 2.5) {
        setTimeout(function(){ if (state.stage === 'door') nextStage(); }, 1200);
      }
    }
  },
  render() {
    const t = state.t;
    const doorX = W*0.5, doorY = H*0.40;
    const dw = Math.min(W*0.52, 225);
    const dh = dw * 1.28;
    const bx = doorX - dw/2;
    const by = doorY + dh/2;
    const ty = doorY - dh/2;
    const ar = dw * 0.5;

    // 门框
    const doorPath = new Path2D();
    doorPath.moveTo(bx, by);
    doorPath.lineTo(bx, ty + ar);
    doorPath.quadraticCurveTo(bx, ty, doorX, ty);
    doorPath.quadraticCurveTo(bx + dw, ty, bx + dw, ty + ar);
    doorPath.lineTo(bx + dw, by);
    doorPath.lineTo(bx, by);

    // 门内光（裁在门框里）
    if (this.doorOpen > 0.01) {
      ctx.save();
      ctx.clip(doorPath);
      const g = ctx.createRadialGradient(doorX, by - dh*0.15, 0, doorX, by - dh*0.15, dh*0.85);
      g.addColorStop(0, 'rgba(255,250,235,' + (0.80*this.doorOpen) + ')');
      g.addColorStop(0.35, 'rgba(255,226,170,' + (0.30*this.doorOpen) + ')');
      g.addColorStop(1, 'rgba(255,190,110,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.fillRect(bx, ty, dw, dh);
      ctx.restore();
    }

    ctx.globalAlpha = 0.6 + this.doorOpen * 0.3;
    ctx.strokeStyle = 'rgba(255,226,176,1)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(255,200,130,0.8)';
    ctx.shadowBlur = 10 + this.doorOpen * 24;
    ctx.stroke(doorPath);
    ctx.shadowBlur = 0;

    // 门缝
    if (this.doorOpen > 0.01) {
      ctx.globalAlpha = this.doorOpen * 0.9;
      ctx.strokeStyle = 'rgba(255,250,232,1)';
      ctx.lineWidth = 2 + this.doorOpen*4;
      ctx.beginPath();
      ctx.moveTo(doorX, ty + 6);
      ctx.lineTo(doorX, by - 4);
      ctx.stroke();
    }

    // 门槛
    ctx.globalAlpha = 0.35 + 0.15*Math.sin(t*1.3);
    ctx.strokeStyle = 'rgba(255,220,160,1)';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(bx - 10, by);
    ctx.lineTo(bx + dw + 10, by);
    ctx.stroke();

    // 罐子
    stageImpl.jar.render();
  }
};

/* ============================================================
   10 · 美乐蒂

function melodyOutline() {
  const cx = W * 0.5;
  const cy = H * MELODY_CY;
  const pw = Math.min(W * 0.80, 300);
  const ph = pw * (720 / 900);
  const pts = [];
  for (let i = 0; i < MELODY_POINTS.length; i++) {
    const p = MELODY_POINTS[i];
    pts.push({
      x: cx + (p[0] - 0.5) * pw,
      y: cy + (p[1] - 0.5) * ph,
      color: p[2] === 0 ? 'pink' : (p[2] === 1 ? 'white' : (p[2] === 2 ? 'dark' : 'yellow'))
    });
  }
  return pts;
}

stageImpl.melody = {
  lit: false,
  lightT: 0,
  dots: [],
  revealed: false,
  finaleShown: false,

  init() {
    state.warmthTarget = 1.0;
    this.lit = false;
    this.lightT = 0;
    this.revealed = false;
    this.finaleShown = false;
    this.imgAlpha = 0;
    this.dots = [];

    const pts = melodyOutline();
    const sizes = {
      pink: [4, 7],
      white: [4, 7],
      dark: [5, 8],
      yellow: [5, 8]
    };
    for (let i = 0; i < pts.length; i++) {
      const p = pts[i];
      const rg = sizes[p.color] || [11, 15];
      this.dots.push({
        x: W*0.5, y: H*MELODY_CY,
        tx: p.x, ty: p.y,
        t: -1.0 - i * 0.0026,
        dur: 1.0,
        ph: rnd(0, TAU),
        size: rnd(rg[0], rg[1]),
        color: p.color
      });
    }

    orb.visible = false;
    jar.alpha = 0;
    melodyEl.classList.remove('on');
    finaleEl.classList.remove('on');
    this.imgShown = false;

    const imgEl = document.getElementById('melodyImgEl');
    imgEl.classList.remove('on');
    imgEl.src = MELODY_IMG_SRC;
  },

  update(dt) {
    if (!this.lit) return;
    this.lightT += dt;

    if (this.lightT > 0.7) {
      for (let i = 0; i < this.dots.length; i++) {
        const d = this.dots[i];
        if (d.t >= 1) continue;
        d.t = Math.min(1, d.t + dt / d.dur);
        if (d.t < 0) continue;
        const e = easeOut(d.t);
        d.x = lerp(W*0.5, d.tx, e);
        d.y = lerp(H*MELODY_CY, d.ty, e);
      }
    }

    if (this.lightT > 2.6) {
      this.imgAlpha = Math.min(1, (this.lightT - 2.6) / 1.3);
      if (!this.imgShown) {
        this.imgShown = true;
        document.getElementById('melodyImgEl').classList.add('on');
      }
    }

    if (this.lightT > 3.4 && !this.revealed) {
      this.revealed = true;
      melodyEl.classList.add('on');
      chord([130.81, 261.63, 392.00, 523.25, 659.25, 783.99], 0, 0.09, 4.0);
    }

    if (this.lightT > 5.6 && !this.finaleShown) {
      this.finaleShown = true;
      finaleEl.classList.add('on');
    }
  },

  render() {
    const t = state.t;
    const x = W*0.5, y = H*MELODY_CY;

    // 粉色氛围
    const amb = ctx.createRadialGradient(x, H*0.32, 0, x, H*0.32, Math.max(W, H) * 0.8);
    amb.addColorStop(0, 'rgba(255,150,200,' + (this.lit ? 0.11 : 0.045) + ')');
    amb.addColorStop(1, 'rgba(255,120,180,0)');
    ctx.globalAlpha = 1;
    ctx.fillStyle = amb;
    ctx.fillRect(0, 0, W, H);

    if (!this.lit) {
      const base = 0.38 + 0.16*Math.sin(t*1.1);
      const gr = 46;
      const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
      g.addColorStop(0, 'rgba(255,238,246,' + (0.9*base) + ')');
      g.addColorStop(0.3, 'rgba(255,182,212,' + (0.35*base) + ')');
      g.addColorStop(1, 'rgba(255,140,190,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, gr, 0, TAU); ctx.fill();

      ctx.globalAlpha = 0.55;
      ctx.drawImage(SPR.pink, x-9, y-9, 18, 18);
    } else if (this.lightT < 1.5) {
      const k = 1 - this.lightT / 1.5;
      const gr = 60 + this.lightT * 130;
      const g = ctx.createRadialGradient(x, y, 0, x, y, gr);
      g.addColorStop(0, 'rgba(255,246,250,' + (0.9*k) + ')');
      g.addColorStop(0.3, 'rgba(255,196,222,' + (0.4*k) + ')');
      g.addColorStop(1, 'rgba(255,150,200,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, gr, 0, TAU); ctx.fill();
    }

    const dotFade = 1 - this.imgAlpha * 0.92;

    for (let i = 0; i < this.dots.length; i++) {
      const d = this.dots[i];
      if (d.t < 0) continue;
      const fixed = (d.color === 'dark' || d.color === 'yellow');
      const tw = fixed ? 1 : (0.62 + 0.38 * Math.sin(t*2 + d.ph));
      const a = clamp(d.t, 0, 1) * tw * dotFade;
      if (a < 0.02) continue;
      const s = d.size;
      const spr = d.color === 'pink' ? SPR.pink :
                  d.color === 'white' ? SPR.white :
                  d.color === 'dark' ? SPR.dark : SPR.yellow;
      ctx.globalAlpha = a;
      ctx.drawImage(spr, d.x - s/2, d.y - s/2, s, s);
    }

  },

  tap(x, y) {
    if (this.lit) return;
    if (Math.hypot(x - W*0.5, y - H*MELODY_CY) < 130) {
      this.lit = true;
      this.lightT = 0;
      spawnSparks(W*0.5, H*MELODY_CY, 100, 280);
      chord([523.25, 659.25, 783.99, 1046.50], 0, 0.12, 3.0);
    }
  }
};

   绘制工具
   ============================================================ */
function roundRect(p, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  p.moveTo(x + r, y);
  p.lineTo(x + w - r, y);
  p.quadraticCurveTo(x + w, y, x + w, y + r);
  p.lineTo(x + w, y + h - r);
  p.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  p.lineTo(x + r, y + h);
  p.quadraticCurveTo(x, y + h, x, y + h - r);
  p.lineTo(x, y + r);
  p.quadraticCurveTo(x, y, x + r, y);
  p.closePath();
}

   光团绘制
   ============================================================ */
function drawTrail() {
  for (let i = 0; i < trail.length; i++) {
    const q = trail[i];
    const a = q.life * 0.28;
    if (a < 0.008) continue;
    const s = orb.r * 0.32 * q.life;
    ctx.globalAlpha = a;
    ctx.drawImage(SPR.dot, q.x-s/2, q.y-s/2, s, s);
  }
}

function drawOrb() {
  if (orb.alpha <= 0.01 || !orb.visible) return;

  const t = state.t;
  const x = orb.x, y = orb.y;
  const R = orb.r * (1 + orb.flash * 0.12);

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  const lobes = [
    { dx:0.00, dy:0.00, k:2.20, a:0.20 },
    { dx:0.38, dy:-0.26, k:1.25, a:0.16 },
    { dx:-0.31, dy:0.29, k:1.05, a:0.13 },
    { dx:0.12, dy:0.40, k:0.82, a:0.09 }
  ];
  for (let i = 0; i < lobes.length; i++) {
    const L = lobes[i];
    const wob = Math.sin(t*0.7 + i*2.1) * 0.10;
    const cx = x + (L.dx + wob) * R;
    const cy = y + (L.dy - wob*0.6) * R;
    const rr = R * L.k;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, rr);
    g.addColorStop(0.00, 'rgba(255,232,186,' + (L.a*0.9) + ')');
    g.addColorStop(0.28, 'rgba(255,204,136,' + (L.a*0.42) + ')');
    g.addColorStop(0.62, 'rgba(255,170,92,' + (L.a*0.10) + ')');
    g.addColorStop(1.00, 'rgba(255,150,70,0)');
    ctx.globalAlpha = orb.alpha;
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.fill();
  }

  const coreR = R * (0.78 + orb.flash*0.35);
  const cg = ctx.createRadialGradient(x, y, 0, x, y, coreR);
  cg.addColorStop(0.00, 'rgba(255,252,242,' + (0.55*orb.alpha) + ')');
  cg.addColorStop(0.13, 'rgba(255,242,214,' + (0.40*orb.alpha) + ')');
  cg.addColorStop(0.35, 'rgba(255,222,172,' + (0.15*orb.alpha) + ')');
  cg.addColorStop(0.66, 'rgba(255,200,138,' + (0.032*orb.alpha) + ')');
  cg.addColorStop(1.00, 'rgba(255,182,102,0)');
  ctx.globalAlpha = 1;
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(x, y, coreR, 0, TAU); ctx.fill();

  for (let i = 0; i < orbiters.length; i++) {
    const o = orbiters[i];
    const ang = o.a + t*o.sp;
    const rr = R * o.rad * (1 + 0.12*Math.sin(t*o.wob + o.ph));
    const ox = x + Math.cos(ang)*rr;
    const oy = y + Math.sin(ang)*rr*0.78;
    const a = (0.35 + 0.45*Math.sin(t*o.wob*1.7 + o.ph)) * orb.alpha;
    if (a < 0.01) continue;
    const s = o.size * 6;
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.drawImage(SPR.dot, ox-s/2, oy-s/2, s, s);
  }

  ctx.restore();
}

/* ============================================================
   主更新
   ============================================================ */
let meteorTimer = 2.4;

function updateOrb(dt) {
  const baseR = Math.min(Math.min(W, H) * 0.115, 62);
  orb.r = lerp(orb.r, baseR, 1 - Math.pow(0.4, dt));

  const px = orb.x, py = orb.y;
  const k = 1 - Math.pow(0.0012, dt);
  orb.x = lerp(orb.x, orb.tx, k);
  orb.y = lerp(orb.y, orb.ty, k);

  const moved = Math.hypot(orb.x-px, orb.y-py);
  if (moved > 2.5 && orb.visible) {
    trail.push({ x: orb.x, y: orb.y, life: 1 });
    if (trail.length > 24) trail.shift();
  }
  for (let i = trail.length-1; i >= 0; i--) {
    trail[i].life -= dt * 2.2;
    if (trail[i].life <= 0) trail.splice(i,1);
  }

  orb.flash = Math.max(0, orb.flash - dt*1.8);

  if (state.stage === 'pick') {
    orb.tx = clamp(orb.tx, W*0.08, W*0.92);
    orb.ty = clamp(orb.ty, H*0.18, H*0.95);
  }
}

function update(dt) {
  state.t += dt;
  state.stageT += dt;
  state.transition = Math.min(1, state.transition + dt * 1.6);
  state.warmth = lerp(state.warmth, state.warmthTarget, 1 - Math.pow(0.3, dt));

  updateOrb(dt);

  if (!state.intro) {
    const impl = stageImpl[state.stage];
    if (impl && impl.update) impl.update(dt);
  }

  meteorTimer -= dt;
  if (meteorTimer <= 0) { spawnMeteor(); meteorTimer = rnd(2.6, 7.0); }
  updateMeteors(dt);
  updateParticles(dt);
  updateSparks(dt);

  // 未使用的星星回位
  if (state.stage !== 'pick') {
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (s.dead) { s.fade -= dt*2.6; continue; }
      s.ox *= Math.pow(0.02, dt);
      s.oy *= Math.pow(0.02, dt);
      s.pull = 0;
    }
  }
}

/* ============================================================
   主渲染
   ============================================================ */
function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if (bgCanvas) ctx.drawImage(bgCanvas, 0, 0, W, H);

  if (state.warmth > 0.01) {
    const wm = state.warmth;
    const tg = ctx.createRadialGradient(W*0.5, H*0.60, 0, W*0.5, H*0.60, Math.max(W,H)*0.9);
    const r = Math.round(120 + 135*wm);
    const g = Math.round(80 + 90*wm);
    const b = Math.round(180 - 80*wm);
    tg.addColorStop(0, 'rgba(' + r + ',' + g + ',' + b + ',' + (0.11*wm) + ')');
    tg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = tg;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = 'lighter';

  // 背景星星（点星阶段淡化）
  const starDim = state.stage === 'point' ? 0.45 : 1;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    if (s.dead && s.fade <= 0) continue;
    const tw = 0.60 + 0.40*Math.sin(state.t*s.sp + s.ph);
    const a = s.a * tw * (s.dead ? Math.max(0,s.fade) : 1) * starDim;
    if (a <= 0.006) continue;
    const x = s.x + s.ox, y = s.y + s.oy;
    const spr = s.tint === 0 ? SPR.cold : (s.tint === 1 ? SPR.warm : SPR.blue);
    const size = s.r * 7.2 * (s.dead ? 1 + (1-s.fade)*2.4 : 1);
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.drawImage(spr, x-size/2, y-size/2, size, size);

    if (s.pull > 0.55 && !s.dead && orb.alpha > 0.1) {
      ctx.globalAlpha = (s.pull-0.55)*0.85*a;
      ctx.strokeStyle = 'rgba(255,214,158,1)';
      ctx.lineWidth = 0.7;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(orb.x, orb.y); ctx.stroke();
    }
    if (s.bright && !s.dead) {
      const L = (4 + s.r*4.2)*tw;
      ctx.globalAlpha = clamp(a*0.5, 0, 1);
      ctx.strokeStyle = 'rgba(216,232,255,0.9)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(x-L,y); ctx.lineTo(x+L,y);
      ctx.moveTo(x,y-L); ctx.lineTo(x,y+L);
      ctx.stroke();
    }
  }

  ctx.globalAlpha = 1;
  drawMeteors();
  drawParticles();
  drawSparks();
  drawTrail();

  if (!state.intro) {
    const impl = stageImpl[state.stage];
    if (impl && impl.render) impl.render();
  }

  drawOrb();

  // 转场淡入
  if (state.transition < 1) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1 - state.transition;
    ctx.fillStyle = '#03040c';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ============================================================
   指针事件
   ============================================================ */
function onPointerMove(e) {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  if (state.stage === 'pick') {
    orb.tx = e.clientX;
    orb.ty = e.clientY + (isCoarse ? Math.min(H*0.13, 120) : 0);
  }
  if (state.stage === 'gather' || state.stage === 'gravity' ||
      state.stage === 'chase' || state.stage === 'sequence') {
    orb.tx = e.clientX;
    orb.ty = e.clientY + (isCoarse ? Math.min(H*0.13, 120) : 0);
  }
  if (state.stage === 'jar' || state.stage === 'door') {
    orb.tx = e.clientX;
    orb.ty = e.clientY;
  }
  if (!audioAttempted) { audioAttempted = true; ensureAudio(); }
}

function onPointerDown(e) {
  pointer.x = e.clientX;
  pointer.y = e.clientY;
  pointer.down = true;
  pointer.downX = e.clientX;
  pointer.downY = e.clientY;
  ensureAudio();

  if (state.intro) return;
  const impl = stageImpl[state.stage];
  if (impl && impl.tap) impl.tap(e.clientX, e.clientY);
}

function onPointerUp() {
  pointer.down = false;
}

window.addEventListener('pointermove', onPointerMove, { passive: true });
window.addEventListener('pointerdown', onPointerDown, { passive: true });
window.addEventListener('pointerup', onPointerUp, { passive: true });
window.addEventListener('pointercancel', onPointerUp, { passive: true });

/* ============================================================
   主循环
   ============================================================ */
let lastTime = 0;

function frame(now) {
  if (!lastTime) lastTime = now;
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.06) dt = 0.06;
  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* ============================================================
   初始化
   ============================================================ */
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);

  canvas.width = Math.round(W*DPR);
  canvas.height = Math.round(H*DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  buildBackground();
  buildStars();
}

function boot() {
  buildSprites();
  buildOrbiters();
  resize();

  orb.x = W*0.5;
  orb.y = H*0.60;
  orb.tx = W*0.5;
  orb.ty = H*0.58;

  stagebar.classList.add('on');

  requestAnimationFrame(frame);
  enterStage('intro');
}

let resizeTimer = null;
window.addEventListener('resize', function () {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(resize, 180);
});

boot();

/* 开发用：可按阶段跳转 */
window.__gotoStage = enterStage;

})();
</script>
</body>
</html>
